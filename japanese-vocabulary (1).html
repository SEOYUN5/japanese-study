function start(review=false){reviewing=review;let words=pool().filter(w=>!review||saved.wrong.includes(w.id));if(!words.length){$('#quiz').innerHTML='<div class="result"><div class="score">✓</div><h2>쌓인 오답이 없어요!</h2><p>선택한 범위에서 틀린 단어가 생기면<br>여기서 다시 연습할 수 있어요.</p><button class="primary" id="back">새 연습 시작</button></div>';$('#back').onclick=()=>start();return}queue=shuffle(words).slice(0,+$('#count').value);index=correct=streak=best=0;sessionWrong=[];viewState='quiz';render()}
function render(){answered=false;selected=null;const w=queue[index],mode=$('#mode').value;direction=mode==='mix'?(Math.random()<.5?'meaning':'japanese'):mode;let jp=direction==='meaning';let expected=jp?w.ko:w.jp;let candidates=shuffle(pool().filter(x=>x.jp!==w.jp&&x.ko!==w.ko&&!x.ko.split(/[,，]/).some(k=>w.ko.split(/[,，]/).map(s=>s.trim()).includes(k.trim()))));options=[expected];for(const c of candidates){let v=jp?c.ko:c.jp;if(!options.includes(v))options.push(v);if(options.length===4)break}options=shuffle(options);$('#quiz').innerHTML=`<div class="topline"><span>${reviewing?'오답 복습':'단어 연습'} · ${w.lesson}과</span><span class="pill">${correct*10} XP · ${streak} 연속 정답</span></div><div class="progress" role="progressbar" aria-valuenow="${index}" aria-valuemin="0" aria-valuemax="${queue.length}"><i style="width:${index/queue.length*100}%"></i></div><div class="prompt">${direction==='write'?'뜻에 맞는 일본어를 써 주세요.':jp?'이 단어의 뜻을 골라 주세요.':'뜻에 맞는 일본어를 골라 주세요.'}</div><h2 class="word" ${jp?'lang="ja"':''}>${esc(jp?w.jp:w.ko)}</h2>${direction==='write'?'<input id="answerInput" class="write" lang="ja" autocomplete="off" spellcheck="false" aria-label="일본어 답" placeholder="히라가나로 입력하세요"><button class="hint" id="hint">첫 글자 힌트 보기</button><div class="small">가타카나 단어는 가타카나·히라가나 모두 가능해요.<br>표현 앞의 ～와 띄어쓰기는 생략해도 돼요.</div>':`<div class="answers">${options.map((v,i)=>`<button class="option" data-option="${i}" aria-pressed="false"><b>${i+1}</b><span>${esc(v)}</span></button>`).join('')}</div>`}<div class="bottom"><div id="feedback" aria-live="polite"></div><div class="action"><span class="small">${index+1} / ${queue.length} 문제</span><button id="check" class="primary" ${direction==='write'?'':'disabled'}>정답 확인</button></div></div>`;
if(direction==='write'){$('#hint').onclick=()=>{$('#hint').textContent='첫 글자: '+w.jp.replace(/^～/,'').slice(0,1)+'…'};$('#answerInput').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();if(answered)next();else check()}}}else document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.option;document.querySelectorAll('[data-option]').forEach(o=>{o.classList.toggle('selected',o===b);o.setAttribute('aria-pressed',o===b?'true':'false')});$('#check').disabled=false});$('#check').onclick=check}
function normalize(s){return s.normalize('NFKC').replace(/[\s~〜～]/g,'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96))}
function check(){if(answered)return;let w=queue[index],isWrite=direction==='write',expected=direction==='meaning'?w.ko:w.jp,ok;if(isWrite){let v=$('#answerInput').value;if(!v.trim()){$('#answerInput').focus();return}ok=normalize(v)===normalize(expected)||(w.jp==='さんじゅっさい'&&normalize(v)==='さんじっさい');$('#answerInput').disabled=true;$('#hint').disabled=true}else{if(selected===null)return;ok=options[selected]===expected;document.querySelectorAll('[data-option]').forEach(b=>{let i=+b.dataset.option;b.disabled=true;b.classList.remove('selected');if(options[i]===expected)b.classList.add('correct');else if(i===selected)b.classList.add('wrong')})}answered=true;if(ok){correct++;streak++;best=Math.max(best,streak);saved.xp+=10;saved.wrong=saved.wrong.filter(id=>id!==w.id)}else{streak=0;sessionWrong.push(w);if(!saved.wrong.includes(w.id))saved.wrong.push(w.id)}persist();$('#feedback').innerHTML=`<div class="feedback ${ok?'':'bad'}"><strong>${ok?'잘했어요! +10 XP':'괜찮아요. 이 단어를 기억해 봐요.'}</strong><br><span lang="ja">${esc(w.jp)}</span> = ${esc(w.ko)}<span class="pronunciation">발음: <strong>${esc(w.pron)}</strong></span>${w.pronNote?`<span class="pronunciation">${esc(w.pronNote)}</span>`:""}</div>`;$('#check').textContent=index===queue.length-1?'결과 보기':'다음 문제 →';$('#check').onclick=next;$('#check').focus()}
function next(){if(!answered)return;index++;if(index>=queue.length)finish();else render()}
function finish(){viewState='result';$('#quiz').innerHTML=`<div class="result"><div class="eyebrow">LESSON COMPLETE</div><div class="score">${Math.round(correct/queue.length*100)}<span style="font-size:24px">%</span></div><h2>${correct===queue.length?'전부 맞혔어요!':'한 걸음 더 익숙해졌어요.'}</h2><p class="small">${queue.length}문제 중 ${correct}문제를 맞혔어요.</p><div class="stats"><div><strong>+${correct*10}</strong><span class="small">획득 XP</span></div><div><strong>${best}</strong><span class="small">최고 연속 정답</span></div><div><strong>${sessionWrong.length}</strong><span class="small">복습할 단어</span></div></div><button class="primary" id="again">다시 도전하기</button>${sessionWrong.length?'<button class="secondary" id="retry" style="margin:12px">이번 오답 다시 풀기</button>':''}</div>`;$('#again').onclick=()=>start();if($('#retry'))$('#retry').onclick=()=>{queue=shuffle(sessionWrong);index=correct=streak=best=0;sessionWrong=[];reviewing=true;viewState='quiz';render()}}
function vocabulary(){viewState='vocab';$('#quiz').innerHTML=`<div class="vocab-head"><h2>${lesson?lesson+'과':'전체'} 단어장</h2><button class="secondary" id="return">문제 풀기</button></div><p class="pron-note"><strong>ː 장음</strong> — 앞 모음을 2박 길게: 키노ː, 코ː히ː<br><strong>· 촉음</strong> — 1박 막거나 멈추기: 춋·토, 킵·푸<br>えい 계열은 보통 에ː로 읽어요. 한글은 발음 보조 표기이며 음높이까지 나타내지는 않아요.</p><input id="search" placeholder="일본어 · 뜻 · 한글 발음 검색" aria-label="단어 검색"><div id="list" class="vocab-list"></div>`;const show=()=>{$('#list').innerHTML=pool().filter(w=>normalize(w.jp+' '+w.ko+' '+w.pron).includes(normalize($('#search').value))).map(w=>`<div class="row"><div><strong lang="ja">${esc(w.jp)}</strong><span class="pronunciation">${esc(w.pron)}</span>${w.pronNote?`<small class="pron-detail">${esc(w.pronNote)}</small>`:""}</div><span>${esc(w.ko)} · ${w.lesson}과</span></div>`).join('')||'<p>검색 결과가 없어요.</p>'};$('#search').oninput=show;$('#return').onclick=()=>start();show()}
$('#start').onclick=()=>start();$('#review').onclick=()=>start(true);$('#vocab').onclick=vocabulary;$('#mode').onchange=()=>start();$('#count').onchange=()=>start();$('#download').textContent='HTML 파일로 실행 중';$('#download').disabled=true;document.addEventListener('keydown',e=>{if(e.target.matches('input,select')||viewState!=='quiz'||answered)return;if(/^[1-4]$/.test(e.key)){const choice=document.querySelector('[data-option="'+(+e.key-1)+'"]');if(choice)choice.click()}});controls();start();

}catch(error){var box=document.getElementById('quiz');if(box){box.textContent='문제를 불러오지 못했어요. 페이지를 새로고침해 주세요. 계속되면 아래 오류를 알려 주세요: '+String(error.message||error);} }
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',boot,{once:true});}else{boot();}
})();
</script></body></html>
